[project]
name = "antplus-recorder"
version = "0.5.0"
description = "Record and display every ANT+ sensor in range: power meters, smart trainers and heart rate straps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Martin Mahner", email = "martin@mahner.org" }
]
keywords = ["ant+", "antplus", "power meter", "smart trainer", "cycling", "fit", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
    "garmin-fit-sdk>=21.218.0",
    "libusb-package>=1.0.30.0",
    "openant>=1.3.4",
    "textual>=8.2.8",
    "tomlkit>=0.15.1",
]

[project.scripts]
antplus-recorder = "antplus_recorder:main"

[project.urls]
Homepage = "https://github.com/bartTC/antplus-recorder"
Issues = "https://github.com/bartTC/antplus-recorder/issues"
Changelog = "https://github.com/bartTC/antplus-recorder/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
target-version = "py311"  # keep in sync with requires-python
lint.select = ["ALL"]
lint.ignore = [
    # Valid exclusions.
    "COM812", # Conflicts with ruff format
    "E501", # Line too long (>88)
    "D203", # incorrect-blank-line-before-class (conflicts with D211)
    "D212", # Don't require summary on first line
    "ERA001", # Found commented-out code
    "FBT", # Flake Boolean Trap (don't use arg=True in functions)
    "D", # docstrings are written where they help, not on every function
    "CPY001", # the license is in LICENSE, no header in every file
    "RUF001", "RUF002", "RUF003", # typographic characters (Δ · ●) in the interface are intended
    "PLR2004", # ANT+ page numbers and byte offsets are the protocol, not magic numbers
    "PLR0913", "PLR0917", # a tile's comparison takes many inputs — not a smell here
]

[tool.ruff.lint.mccabe]
max-complexity = 15  # page decoding and the dashboard refresh branch a lot

[tool.ruff.lint.pylint]
max-branches = 15

[tool.ruff.lint.extend-per-file-ignores]
"tests/test_*.py" = [
    "S101", # Use of `assert` detected
    "D", # Tests don't need docstrings on every class/method
    "ANN", # Fake objects and inline helpers don't need full type annotations
    "SLF001", # Tests routinely reach into implementation internals
]
"tests/conftest.py" = ["D", "ANN"]
"src/antplus_recorder/__init__.py" = [
    "T201", # the command prints the files it wrote
]
"tests/__init__.py" = ["D104"]
